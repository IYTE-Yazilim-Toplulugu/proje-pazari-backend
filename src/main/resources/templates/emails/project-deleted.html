<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Project Deleted</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f7; padding: 40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                    <!-- Header -->
                    <tr>
                        <td style="background-color: #dc3545; padding: 24px 32px; text-align: center;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 600;">Project Deleted</h1>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 32px;">
                            <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #333333;">
                                Hello <span th:text="${firstName}" style="font-weight: 600;"></span>,
                            </p>
                            <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #333333;">
                                Your project <strong th:text="${projectTitle}"></strong> has been successfully deleted.
                            </p>
                            <p th:if="${rejectedApplicationCount > 0}" style="margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #333333;">
                                As a result, <strong th:text="${rejectedApplicationCount}"></strong>
                                pending application(s) were automatically rejected.
                            </p>
                            <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #333333;">
                                Thank you for using Proje Pazarı!
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f8f9fa; padding: 16px 32px; text-align: center; border-top: 1px solid #e9ecef;">
                            <p style="margin: 0; font-size: 12px; color: #6c757d;">
                                © 2026 Proje Pazarı — IYTE Yazılım Topluluğu
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
