# Production Profile Configuration
# All sensitive values MUST be provided via environment variables

# Database - Production PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA - Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Storage - MinIO/S3-compatible storage
storage.provider=minio
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET:proje-pazari-files}

# JWT - Must be set via environment variable
jwt.secret=${JWT_SECRET}

# Actuator — prometheus always exposed for Grafana; health details restricted
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.environment=prod

# JPA — Enforce schema validation (no auto-DDL in prod)
spring.jpa.hibernate.ddl-auto=validate

