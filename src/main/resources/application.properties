spring.application.name=proje-pazari

# Default Profile (use -Dspring.profiles.active=prod for production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration (defaults, override in profile-specific files)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proje_pazari_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yazilim}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yazilim123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Transaction configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.transaction.default-timeout=30

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Development keeps the existing Hibernate update workflow. Production and staging override this
# and enable Flyway as the sole schema mutation mechanism.
spring.flyway.enabled=false

# SQL Initialization - Load sample data after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Common tags applied to every metric for filtering in Grafana
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active:dev}

# Histogram for HTTP request latency (needed for histogram_quantile in Prometheus)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s
# Bound histogram bucket range to reduce memory/CPU overhead (<2% target)
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.enable.hikaricp=true

# Disable JMX — Prometheus scraping makes JMX redundant; disabling it reduces overhead
spring.jmx.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-in-production-insecure-default-placeholder}
jwt.expiration=86400000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# Email Verification Configuration
app.email.from=${EMAIL_FROM:noreply@projepazari.com}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.frontend.reset-password-path=${FRONTEND_RESET_PASSWORD_PATH:/reset-password}
app.frontend.verify-email-path=${FRONTEND_VERIFY_EMAIL_PATH:/verify-email}

# WebSocket/STOMP Configuration
# Comma-separated exact origins. Wildcards are intentionally unsupported for the admin feed.
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:${app.frontend.url}}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Storage Configuration
storage.provider=${STORAGE_PROVIDER:minio}
storage.local.path=./uploads
storage.max-file-size=10MB
storage.allowed-content-types=image/jpeg,image/png,image/gif,image/webp,application/pdf

# MinIO Configuration (defaults, override in profile-specific files or env vars)
minio.url=${MINIO_URL:http://localhost:9002}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin123}
minio.bucket-name=${MINIO_BUCKET:proje-pazari-files}
storage.buckets.avatars=${MINIO_AVATARS_BUCKET:proje-pazari-avatars}
storage.buckets.documents=${MINIO_DOCUMENTS_BUCKET:proje-pazari-documents}
minio.backups-bucket=${MINIO_BACKUPS_BUCKET:proje-pazari-backups}

# Elasticsearch Configuration
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=30s

# Elasticsearch index settings
app.elasticsearch.project-index=projects
app.elasticsearch.user-index=users

# Elasticsearch replica configuration (environment-specific)
app.elasticsearch.number-of-replicas=${ELASTICSEARCH_REPLICAS:0}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000

# IP Ban Cache
security.ip-ban-cache-ttl-seconds=60

# Access-token lifetime — must match jwt.expiration; used for per-user blacklist TTL
security.access-token.ttl-seconds=86400

# JWT Refresh Token
jwt.refresh-token-expiration=604800000

# Logging Configuration
# Suppress Spring Data multi-module ambiguity INFO noise (JPA/ES/Redis coexistence)
logging.level.org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport=WARN
