# Staging Profile Configuration
# Mirrors production settings but allows monitoring endpoints and debug aids.
# All sensitive values MUST be provided via environment variables.

# Database — Staging PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA — Disable SQL logging; keep DDL auto=validate in staging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

# Storage — MinIO/S3-compatible
storage.provider=minio
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET:proje-pazari-files-staging}

# JWT — Must be set via environment variable
jwt.secret=${JWT_SECRET}

# Actuator — Full monitoring endpoints enabled for staging
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.environment=staging

# Logging — Reduced verbosity compared to dev
logging.level.com.iyte_yazilim=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
