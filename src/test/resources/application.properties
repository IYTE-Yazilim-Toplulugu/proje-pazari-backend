spring.application.name=demo

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, useful for debugging)
spring.h2.console.enabled=true

# JPA/Hibernate settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT Configuration for tests
jwt.secret=test-secret-key-for-testing-purposes-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000

# File Upload Configuration for tests
app.upload.dir=${java.io.tmpdir}/proje-pazari-test-uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging
logging.level.org.springframework.security=DEBUG
