services:

  redis:
    image: redis:7-alpine
    container_name: proje-pazari-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proje-pazari-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: proje-pazari-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ADMIN_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ADMIN_PASSWORD:-minioadmin123}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE:-public}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - proje-pazari-network
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: proje-pazari-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ADMIN_USER: ${MINIO_ADMIN_USER:-minioadmin}
      MINIO_ADMIN_PASSWORD: ${MINIO_ADMIN_PASSWORD:-minioadmin123}
      MINIO_FILES_BUCKET: ${MINIO_FILES_BUCKET:-proje-pazari-files}
      MINIO_AVATARS_BUCKET: ${MINIO_AVATARS_BUCKET:-proje-pazari-avatars}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-proje-pazari-documents}
      MINIO_BACKUPS_BUCKET: ${MINIO_BACKUPS_BUCKET:-proje-pazari-backups}
      MINIO_CREATE_BACKEND_USER: ${MINIO_CREATE_BACKEND_USER:-false}
      MINIO_BACKEND_USER: ${MINIO_APP_ACCESS_KEY:-backend-app}
      MINIO_BACKEND_PASSWORD: ${MINIO_APP_SECRET_KEY:-backend-app-secret-change-me}
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - proje-pazari-network

  postgres:
    image: postgres:16-alpine
    container_name: proje-pazari-db
    environment:
      POSTGRES_DB: proje_pazari_db
      POSTGRES_USER: yazilim
      POSTGRES_PASSWORD: yazilim123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yazilim -d proje_pazari_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proje-pazari-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proje-pazari-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/proje_pazari_db
      SPRING_DATASOURCE_USERNAME: yazilim
      SPRING_DATASOURCE_PASSWORD: yazilim123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      JWT_SECRET: "proje-pazari-dev-secret-key-2025-please-change-in-production-this-is-just-for-development"
      # MinIO Storage Configuration
      STORAGE_PROVIDER: minio
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_FILES_BUCKET:-proje-pazari-files}
      MINIO_AVATARS_BUCKET: ${MINIO_AVATARS_BUCKET:-proje-pazari-avatars}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-proje-pazari-documents}
      MINIO_BACKUPS_BUCKET: ${MINIO_BACKUPS_BUCKET:-proje-pazari-backups}
      # Elasticsearch Configuration
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - proje-pazari-network
    restart: unless-stopped

  minio-backup:
    image: minio/mc:latest
    container_name: proje-pazari-minio-backup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ADMIN_USER: ${MINIO_ADMIN_USER:-minioadmin}
      MINIO_ADMIN_PASSWORD: ${MINIO_ADMIN_PASSWORD:-minioadmin123}
      MINIO_FILES_BUCKET: ${MINIO_FILES_BUCKET:-proje-pazari-files}
      MINIO_AVATARS_BUCKET: ${MINIO_AVATARS_BUCKET:-proje-pazari-avatars}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-proje-pazari-documents}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-minio.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    networks:
      - proje-pazari-network
    profiles:
      - maintenance

  minio-backup-scheduler:
    image: minio/mc:latest
    container_name: proje-pazari-minio-backup-scheduler
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ADMIN_USER: ${MINIO_ADMIN_USER:-minioadmin}
      MINIO_ADMIN_PASSWORD: ${MINIO_ADMIN_PASSWORD:-minioadmin123}
      MINIO_FILES_BUCKET: ${MINIO_FILES_BUCKET:-proje-pazari-files}
      MINIO_AVATARS_BUCKET: ${MINIO_AVATARS_BUCKET:-proje-pazari-avatars}
      MINIO_DOCUMENTS_BUCKET: ${MINIO_DOCUMENTS_BUCKET:-proje-pazari-documents}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-minio.sh:/backup.sh:ro
      - ./scripts/backup-minio-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    networks:
      - proje-pazari-network
    profiles:
      - maintenance
    restart: unless-stopped

  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: proje-pazari-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@proje-pazari.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgpass:ro
    depends_on:
      - postgres
    networks:
      - proje-pazari-network
    restart: unless-stopped
    profiles:
      - tools

  # Elasticsearch stack for logging and monitoring
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: proje_pazari_elasticsearch
    environment:
      - discovery.type=single-node
      # Default heap size set to 1GB; adjust -Xms / -Xmx based on your data volume and workload.
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - proje-pazari-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    container_name: proje_pazari_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - proje-pazari-network

  logstash:
    image: docker.elastic.co/logstash/logstash:9.0.0
    container_name: proje_pazari_logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
    ports:
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      - "LS_JAVA_OPTS=-Xmx256m -Xms256m"
    depends_on:
      - elasticsearch
    networks:
      - proje-pazari-network

  prometheus:
    image: prom/prometheus:latest
    container_name: proje-pazari-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-admin-api"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - proje-pazari-network
    profiles:
      - monitoring
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: proje-pazari-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - proje-pazari-network
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: proje-pazari-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - alertmanager
    networks:
      - proje-pazari-network
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  proje-pazari-network:
    driver: bridge
