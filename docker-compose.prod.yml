# docker-compose.prod.yml
# Production overrides — merge with:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# What this changes vs base:
#   • app runs with prod profile (no SQL logging, restricted actuator)
#   • All secrets come from environment / .env.prod (never committed)
#   • Resource limits enforced
#   • Grafana anonymous access disabled, custom ini applied
#   • Prometheus restricted to internal network (no public port)
#   • pgAdmin disabled entirely
#   • Restart policy: always

services:
  app:
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  prometheus:
    restart: always
    # Do NOT expose 9090 publicly in production; accessible only within Docker network
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  grafana:
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
    volumes:
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  db:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    restart: always

  minio:
    restart: always

  pgadmin:
    profiles:
      - disabled    # Never start pgAdmin in production

  elasticsearch:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
