plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'eclipse'
    id 'idea'
    id 'jacoco'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // GreenMail for email testing
    testImplementation 'com.icegreen:greenmail-junit5:2.0.0'
    testImplementation 'com.icegreen:greenmail-spring:2.0.0'

    // Spring Boot Thymeleaf Starter
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Spring Boot Mail Starter
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Elasticsearch
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // For JSON processing with Elasticsearch
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ULID
    implementation 'com.github.f4b6a3:ulid-creator:5.2.3'

    // MinIO - Cloud blob storage
    implementation 'io.minio:minio:8.5.7'

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Redis for token blacklisting
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // WebSocket for real-time admin activity dashboard
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Rate limiting
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // RFC 4180-compliant CSV parsing
    implementation 'org.apache.commons:commons-csv:1.10.0'

    // 2FA - Google Authenticator
    implementation 'com.warrenstrange:googleauth:1.5.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    // OpenAPI/Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Email
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // TestContainers for integration tests
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:elasticsearch'
    testImplementation 'org.testcontainers:minio'
    testImplementation 'com.redis:testcontainers-redis:2.2.4'

    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Jacoco configuration for code coverage
jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn compileJava, test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            // Exclude all config classes broadly, then re-include JwtSecretValidator
            // so its coverage is visible in the report.
            fileTree(dir: it, exclude: [
                '**/config/**',
                '**/dto/**',
                '**/dtos/**',
                '**/models/**',
                '**/*Application.class',
                '**/infrastructure/persistence/models/**'
            ]).plus(fileTree(dir: it, include: ['**/config/JwtSecretValidator.class']))
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn compileJava, processResources
    mustRunAfter test

    violationRules {
        // Dedicated rule: JwtSecretValidator must have 100% line coverage.
        rule {
            element = 'CLASS'
            includes = ['*.presentation.config.JwtSecretValidator']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }

        rule {
            element = 'CLASS'
            limit {
                minimum = 0.70
            }
            excludes = [
                '*.config.*',
                '*.dto.*',
                '*.dtos.*',
                '*.models.*',
                '*Application',
                '*.domain.entities.*',
                '*.domain.events.*',
                '*.domain.enums.*',
                '*.domain.exceptions.*',
                '*.infrastructure.persistence.converters.*',
                '*.infrastructure.persistence.elasticsearch.*',
                '*.infrastructure.persistence.mappers.*',
                '*.infrastructure.security.filter.*',
                '*.infrastructure.storage.*',
                '*.infrastructure.utils.*',
                '*MapperImpl',
                // Admin/bulk commands without tests
                '*.commands.adminFeatureProject.*',
                '*.commands.bulkProjectAction.*',
                '*.commands.deleteAllIndexes.*',
                '*.commands.invalidate*',
                '*.commands.reindex*',
                '*.commands.sendTargetedEmail.*',
                '*.commands.updateProjectStatus.*',
                // Queries without tests
                '*.queries.adminGetUser.*',
                '*.queries.adminListApplications.*',
                '*.queries.adminListProjects.*',
                '*.queries.exportApplications.*',
                '*.queries.exportProjects.*',
                '*.queries.getActiveSessions.*',
                '*.queries.getApplicationStats.*',
                '*.queries.getAuditLogs.*',
                '*.queries.getFeatureFlags.*',
                '*.queries.getFlaggedContent.*',
                '*.queries.getMaintenanceStatus.*',
                '*.queries.getProjectStatistics.*',
                '*.queries.getProjectStats.*',
                '*.queries.getScheduledEmails.*',
                '*.queries.getSystemConfig.*',
                '*.queries.getUserStats.*',
                '*.queries.listBannedIps.*',
                '*.queries.searchProjects.*',
                '*.queries.suggestProjects.*',
                '*.application.exceptions.*',
                // Covered by PR #95 (issue #67) or out of scope for this branch
                '*.application.services.ElasticsearchSyncService',
                '*.application.services.ProjectSearchService',
                '*.infrastructure.security.service.GoogleAuthenticatorTwoFactorService',
                // Validators/handlers with low coverage
                '*.commands.submitApplication.SubmitApplicationValidator',
                '*.commands.updateUserProfile.UpdateUserProfileValidator',
                '*.commands.createProject.CreateProjectResult',
                '*.commands.uploadProfilePicture.UploadProfilePictureHandler',
                '*.eventhandlers.EmailVerificationEventHandler',
                // Controllers with extensive admin endpoints
                '*.presentation.controllers.AdminController*',
                '*.presentation.controllers.ElasticsearchAdminController',
                '*.presentation.controllers.BaseController',
                // Interfaces with default methods only
                '*.domain.interfaces.*'
            ]
        }

        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
            excludes = [
                '*.config.*',
                '*.dto.*',
                '*.dtos.*',
                '*.models.*',
                '*Application',
                '*.domain.entities.*',
                '*.domain.events.*',
                '*.domain.enums.*',
                '*.domain.exceptions.*',
                '*.infrastructure.persistence.converters.*',
                '*.infrastructure.persistence.elasticsearch.*',
                '*.infrastructure.persistence.mappers.*',
                '*.infrastructure.security.filter.*',
                '*.infrastructure.storage.*',
                '*.infrastructure.utils.*',
                '*MapperImpl',
                // Admin/bulk commands without tests
                '*.commands.adminFeatureProject.*',
                '*.commands.bulkProjectAction.*',
                '*.commands.deleteAllIndexes.*',
                '*.commands.invalidate*',
                '*.commands.reindex*',
                '*.commands.sendTargetedEmail.*',
                '*.commands.updateProjectStatus.*',
                // Queries without tests
                '*.queries.adminGetUser.*',
                '*.queries.adminListApplications.*',
                '*.queries.adminListProjects.*',
                '*.queries.exportApplications.*',
                '*.queries.exportProjects.*',
                '*.queries.getActiveSessions.*',
                '*.queries.getApplicationStats.*',
                '*.queries.getAuditLogs.*',
                '*.queries.getFeatureFlags.*',
                '*.queries.getFlaggedContent.*',
                '*.queries.getMaintenanceStatus.*',
                '*.queries.getProjectStatistics.*',
                '*.queries.getProjectStats.*',
                '*.queries.getScheduledEmails.*',
                '*.queries.getSystemConfig.*',
                '*.queries.getUserStats.*',
                '*.queries.listBannedIps.*',
                '*.queries.searchProjects.*',
                '*.queries.suggestProjects.*',
                '*.application.exceptions.*',
                // Covered by PR #95 (issue #67) or out of scope for this branch
                '*.application.services.ElasticsearchSyncService',
                '*.application.services.ProjectSearchService',
                '*.infrastructure.security.service.GoogleAuthenticatorTwoFactorService',
                '*.commands.submitApplication.SubmitApplicationValidator',
                '*.commands.updateUserProfile.UpdateUserProfileValidator',
                '*.commands.createProject.CreateProjectResult',
                '*.commands.uploadProfilePicture.UploadProfilePictureHandler',
                '*.eventhandlers.EmailVerificationEventHandler',
                '*.presentation.controllers.AdminController*',
                '*.presentation.controllers.ElasticsearchAdminController',
                '*.presentation.controllers.BaseController',
                // Interfaces with default methods only
                '*.domain.interfaces.*'
            ]
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            // Exclude all config classes broadly, then re-include JwtSecretValidator
            // so its coverage is measured and enforced by the dedicated 100% rule above.
            fileTree(dir: it, exclude: [
                '**/config/**',
                '**/dto/**',
                '**/dtos/**',
                '**/models/**',
                '**/*Application.class',
                '**/infrastructure/persistence/models/**'
            ]).plus(fileTree(dir: it, include: ['**/config/JwtSecretValidator.class']))
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification

// Spotless configuration - Google Java Format with 4-space indentation (AOSP style)
spotless {
    lineEndings 'UNIX'
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.19.2').aosp()  // AOSP style uses 4-space indentation
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', '*.md', '.gitignore'
        trimTrailingWhitespace()
        indentWithSpaces(4)  // Changed to 4 spaces
        endWithNewline()
    }
}

// Configure annotation processing for IDEs
tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
}

// IntelliJ IDEA configuration
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

// Eclipse configuration
eclipse {
    classpath {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Javadoc configuration for API documentation generation
javadoc {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
        use = true
        windowTitle = 'Proje Pazarı Backend API Documentation'
        docTitle = 'Proje Pazarı Backend API'
        header = '<b>Proje Pazarı</b>'
        bottom = 'Copyright © 2024 IYTE Yazılım Topluluğu'

        links = [
            'https://docs.oracle.com/en/java/javase/21/docs/api/',
            'https://docs.spring.io/spring-framework/docs/current/javadoc-api/',
            'https://docs.spring.io/spring-boot/docs/current/api/'
        ]

        addStringOption('Xdoclint:none', '-quiet')
        addBooleanOption('html5', true)
    }

    source = sourceSets.main.allJava
    classpath = configurations.compileClasspath
    destinationDir = file("${buildDir}/docs/javadoc")
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}
