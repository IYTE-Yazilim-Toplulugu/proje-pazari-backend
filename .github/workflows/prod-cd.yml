name: Production CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel in-progress deployments — queue instead
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Format gate — fail fast on style before wasting compute ──────────
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Check code formatting
        run: chmod +x gradlew && ./gradlew spotlessCheck

  # ── 2. Build + test + JaCoCo verification ──────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: format

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build application
        run: chmod +x gradlew && ./gradlew build -x test

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-test-results
          path: build/test-results/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-coverage-report
          path: build/reports/jacoco/

  # ── 3. Build Docker image and push to GHCR ─────────────────────────────
  publish:
    name: Build & Push Image to GHCR
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    outputs:
      # image@sha256:digest — immutable reference passed to the deploy job
      image_ref: ${{ steps.image-name.outputs.lower }}@${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v5

      - name: Compute lowercase image name
        id: image-name
        run: |
          echo "lower=$(echo '${{ env.REGISTRY }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" \
            >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.lower }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Deploy to VPS over SSH ──────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: publish

    # GitHub Environment — configure required reviewers under
    # Settings → Environments → production for manual approval gate
    environment: production

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: IMAGE_REF
          script: |
            set -euo pipefail
            cd /opt/proje-pazari

            # Pull the exact immutable digest built in this run
            echo "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_READ_USER}" --password-stdin
            docker pull "${IMAGE_REF}"

            # Update the running image reference in the prod env file
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_REF}|" .env.prod

            # Recreate only the app container; leave all other services untouched
            docker compose --env-file .env.prod \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-deps app

            # Clean up dangling image layers to reclaim disk space
            docker image prune -f

  # ── 5. Smoke test — verify production health after deploy ───────────────
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check with retry
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "${{ secrets.PROD_HEALTH_URL }}" > /dev/null; then
              echo "Production is healthy"
              exit 0
            fi
            echo "Attempt $i/5 failed — retrying in 15s"
            sleep 15
          done
          echo "Production smoke test failed after 5 attempts"
          exit 1
