name: Dev CI/CD Pipeline

on:
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel in-progress deployments — queue instead
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Run format check first so a style failure doesn't waste minutes on tests
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Check code formatting
        run: chmod +x gradlew && ./gradlew spotlessCheck

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: format

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build application
        run: chmod +x gradlew && ./gradlew build -x test

      - name: Verify clean Flyway migration and Hibernate validation
        run: ./gradlew test --tests 'com.iyte_yazilim.proje_pazari.infrastructure.persistence.FlywaySchemaMigrationIntegrationTest'

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/

  # Build Docker image only after tests pass
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            proje-pazari-backend:dev
            proje-pazari-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO: Push to container registry when ready
      # - name: Push to registry
      #   run: docker push ...

  # Deployment placeholder
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker]

    steps:
      - name: Deployment ready
        run: |
          echo "Build successful for dev branch"
          echo "Docker image built and ready for deployment"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      # TODO: Add deployment steps
      # Examples:
      # - Deploy to staging server via SSH
      # - Push Docker image to registry
      # - Update docker compose on VPS
