name: PR Validation

on:
  pull_request:
    # CI triggers:
    # - opened/reopened: Initial PR creation (runs if ready, skips if draft)
    # - synchronize: New commits pushed (runs if ready, skips if draft)
    # - ready_for_review: Draft → Ready transition (always runs)
    # Note: converted_to_draft NOT included to avoid wasting CI resources
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip CI for draft PRs to save resources
    if: github.event.pull_request.draft == false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Check code formatting
        run: chmod +x gradlew && ./gradlew spotlessCheck

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip CI for draft PRs to save resources
    if: github.event.pull_request.draft == false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build application
        run: chmod +x gradlew && ./gradlew build -x test

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/

  pr_summary:
    name: Post PR Summary
    needs: [format, build-and-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          # GH_PAT: fine-grained PAT with Pull requests: Read and write
          # Required for convertPullRequestToDraft mutation
          # Settings → Secrets and variables → Actions → New repository secret → GH_PAT
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const results = {
              format: '${{ needs.format.result }}',
              buildAndTest: '${{ needs.build-and-test.result }}',
            };

            const icon = (r) => ({ success: '✅', failure: '❌', cancelled: '⏹️', skipped: '⏭️' }[r] ?? '❓');
            const allPassed = Object.values(results).every(r => r === 'success');
            const isDraft = context.payload.pull_request.draft;
            const prNodeId = context.payload.pull_request.node_id;

            const rows = [
              `| Code Formatting (Spotless) | ${icon(results.format)} \`${results.format}\` |`,
              `| Build & Test (Coverage ≥70%) | ${icon(results.buildAndTest)} \`${results.buildAndTest}\` |`,
            ].join('\n');

            const actionNote = allPassed
              ? '> ✅ **All checks passed!** To request code review, manually assign reviewers or mention team members in a comment.'
              : '> **Action required:** Fix the failing checks and push your changes. This PR has been converted to draft until all checks pass.';

            const body = [
              '<!-- pr-validation-summary -->',
              `## PR Validation — ${allPassed ? '✅ All checks passed' : '❌ Checks failed'}`,
              '',
              '| Job | Result |',
              '|-----|--------|',
              rows,
              '',
              actionNote,
              '',
              `_Commit: \`${context.sha.slice(0, 7)}\`_`,
            ].join('\n');

            // Update existing comment or create new one (no duplicates)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- pr-validation-summary -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            // Auto-convert PR to draft if checks fail (best-effort)
            if (!allPassed && !isDraft) {
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    convertPullRequestToDraft(input: { pullRequestId: $id }) {
                      pullRequest { isDraft }
                    }
                  }
                `, { id: prNodeId });
                console.log('✅ Converted PR to draft due to failing checks');
              } catch (e) {
                console.log(`⚠️  Could not convert to draft: ${e.message}`);
              }
            }
