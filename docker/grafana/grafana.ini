#################################### Server ####################################
[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:3030/
# Shown in browser tab and page headers
app_title = Proje Pazarı Monitoring

#################################### Analytics ######################################
[analytics]
# Disable Grafana telemetry and update checks for air-gapped/private deployments
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

#################################### Security ####################################
[security]
# Defaults are overridden by GF_SECURITY_* env vars in docker-compose
disable_gravatar = true
# Prevent embedding in iframes (clickjacking protection)
x_frame_options = SAMEORIGIN
# Strict transport security
strict_transport_security = false
content_security_policy = false

#################################### Users ####################################
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark
home_page = /d/spring-boot-app

#################################### Auth ####################################
[auth]
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d
token_rotation_interval_minutes = 10

[auth.anonymous]
enabled = false

#################################### Dashboards ####################################
[dashboards]
# Proje Pazarı Application Performance is the landing dashboard
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/spring-boot-dashboard.json
versions_to_keep = 20

#################################### Panels ####################################
[panels]
disable_sanitize_html = false
enable_alpha = false

#################################### Unified Alerting ####################################
[unified_alerting]
enabled = true

[alerting]
enabled = false

#################################### Metrics ####################################
[metrics]
enabled = true
interval_seconds = 10

#################################### Logging ####################################
[log]
mode = console
level = warn
filters = rendering:debug

[log.console]
level = warn
format = json
