apiVersion: 1

contactPoints:

  # ── Default (catch-all) ──────────────────────────────────────────────────
  # Slack, Discord, and additional email channels should be configured
  # manually in Grafana UI once the respective credentials are available.
  - orgId: 1
    name: Default
    receivers:
      - uid: default-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: ${GF_ALERT_EMAIL_TO}
          subject: '[Grafana] {{ .CommonLabels.alertname }}'
          singleEmail: true
