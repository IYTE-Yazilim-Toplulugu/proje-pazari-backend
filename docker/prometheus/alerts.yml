groups:
  - name: minio-storage-alerts
    rules:
      - alert: MinIOStorageUsageHigh
        expr: (1 - (sum(minio_cluster_capacity_usable_free_bytes) / sum(minio_cluster_capacity_usable_total_bytes))) * 100 > 80
        for: 10m
        labels:
          severity: warning
          service: minio
        annotations:
          summary: "MinIO storage usage is above 80%"
          description: "MinIO cluster storage utilization has been above 80% for at least 10 minutes."

      - alert: MinIOStorageUsageCritical
        expr: (1 - (sum(minio_cluster_capacity_usable_free_bytes) / sum(minio_cluster_capacity_usable_total_bytes))) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: minio
        annotations:
          summary: "MinIO storage usage is above 90%"
          description: "MinIO cluster storage utilization is critically high and above 90%."

      - alert: MinIODown
        expr: up{job="minio"} == 0
        for: 2m
        labels:
          severity: critical
          service: minio
        annotations:
          summary: "MinIO target is down"
          description: "Prometheus cannot scrape MinIO metrics endpoint for more than 2 minutes."
