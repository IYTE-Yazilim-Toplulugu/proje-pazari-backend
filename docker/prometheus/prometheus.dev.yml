# prometheus.dev.yml — faster scraping for development feedback
global:
  scrape_interval: 5s        # faster than prod's 15s
  evaluation_interval: 5s
  external_labels:
    environment: 'dev'

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'proje-pazari'
          environment: 'dev'
